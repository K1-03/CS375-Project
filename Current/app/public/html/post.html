<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Current - Upload Forum Post</title>
        <link rel="stylesheet" href="/css/style.css">
        <link rel="stylesheet" href="/css/post.css">
    </head>

    <body>
        <header>
            <div class="header-left">
                <a href="/" class="home-button">Current</a>
            </div>
            <div class="header-right">
                <span id="username" class="user-info">Username</span>
                <a href="/account"><img id="avatar" src="/images/Placeholder_Profile_Image.jpg" alt="Avatar" class="avatar"></a>
            </div>
        </header>
    
        <div id="main">
            <div id="forum-post-preview">
                <form id="content-form">
                    <div id="post-info">
                        <label for="subject-input">Subject</label><br>
                        <textarea id="subject-input" name="subject" maxlength="80" style="height: 50px;"></textarea>
                        <div id="subject-counter" class="char-counter">0/80</div>
                        <br>
                        <label for="comment-input">Post Body</label><br>
                        <textarea id="comment-input" name="comment" maxlength="1000"
                            style="height: 100px"></textarea>
                        <div id="comment-counter" class="char-counter">0/1000</div>
                    </div>
                    <label for="postImage">Choose Post Image (optional)</label>
                    <input type="file" name="postImage" id="postImage" accept="image/*">
                    <br><br> 
                    <button id="post" type="submit">Post</button>
                </form>
            </div>
        </div>
        <script src="/javascript/post.js"></script>
    </body>
    
</html>
