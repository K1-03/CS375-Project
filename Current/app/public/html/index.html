<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current - Home</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <a href="/" class="home-button">Current</a>
        </div>
        <div class="header-center">
            <input type="text" placeholder="Search" id="search-bar">
        </div>
        <div class="header-right">
            <span id="username-display"></span>
            <div class="dropdown">
                <img id="avatar" src="/images/Placeholder_Profile_Image.jpg" alt="Avatar" class="avatar dropdown-toggle">
                <div class="dropdown-menu" id="dropdown-menu">
                    <a href="/html/signin.html" id="signin-link">Sign In</a>
                </div>
            </div>
        </div>
    </header>
    <main class="main">
        <div class="thumbnails" id="thumbnails-container">
        </div>
    </main>
    <script src="/javascript/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/user_info')
                .then(response => response.json())
                .then(data => {
                    if (data.signedIn) {
                        document.getElementById('username-display').textContent = data.userInfo.username;
                        document.getElementById('avatar').src = data.userInfo.profilePicture || '/images/Placeholder_Profile_Image.jpg';

                        // Update dropdown menu based on sign-in status
                        document.getElementById('signin-link').style.display = 'none';
                    } else {
                        document.getElementById('username-display').textContent = '';
                        document.getElementById('avatar').src = '/images/Placeholder_Profile_Image.jpg';
                        document.getElementById('signin-link').style.display = 'block';
                    }
                })
                .catch(error => console.error('Error fetching user info:', error));
        });
    </script>
</body>
</html>
