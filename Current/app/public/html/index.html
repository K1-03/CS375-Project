<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current - Home</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <a href="/" class="home-button">Current</a>
        </div>
        <div class="header-center">
            <input type="text" placeholder="Search" id="search-bar">
        </div>
        <div class="header-right">
            <div class="dropdown">
                <span id="username-display"></span> <!-- Span to display username -->
                <img src="/images/Placeholder_Profile_Image.jpg" alt="Avatar" class="avatar dropdown-toggle">
                <div class="dropdown-menu" id="dropdown-menu">
                    <a href="/html/signin.html" id="signin-link">Sign In</a>
                </div>
            </div>
        </div>
    </header>
    <main class="main">
        <div class="thumbnails" id="thumbnails-container">
        </div>
    </main>
    <script src="/javascript/main.js"></script>
</body>
</html>
