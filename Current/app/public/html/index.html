<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current - Home</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="particles-js"></div>
    <header>
        <div class="header-left">
            <a href="/" class="home-button">Current</a>
        </div>
        <div class="header-center">
            <input type="text" placeholder="Search" id="search-bar">
            <div id="sort">
                <button class="menu">Sort By</button>
                <div class="sort-options">
                    <button id="newest-first">Newest First</button>
                    <button id="most-popular">Most Popular</button>
                    <button id="most-liked">Most Liked</button>
                </div>
            </div>
        </div>
        <div class="header-right">
            <span id="username-display"></span>
            <div class="dropdown">
                <img id="avatar" src="/images/Placeholder_Profile_Image.jpg" alt="Avatar" class="avatar dropdown-toggle">
                <div class="dropdown-menu" id="dropdown-menu">
                    <a href="/html/signin.html" id="signin-link">Sign In</a>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <aside id="sidebar">
            <div id="followed-channels-header" class="followed-channels-header">
                <h2>Followed Channels</h2>
            </div>
        </aside>

        <div id="thumbnails-container">
        </div>
    </main>
    <script src="/javascript/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            "particles": {
                "number": {
                    "value": 80,
                    "density": {
                        "enable": true,
                        "value_area": 700
                    }
                },
                "color": {
                    "value": "#ffffff"
                },
                "shape": {
                    "type": "circle",
                    "stroke": {
                        "width": 0,
                        "color": "#000000"
                    }
                },
                "opacity": {
                    "value": 0.5,
                    "random": false,
                    "anim": {
                        "enable": false,
                        "speed": 1,
                        "opacity_min": 0.1,
                        "sync": false
                    }
                },
                "size": {
                    "value": 3,
                    "random": true,
                    "anim": {
                        "enable": false,
                        "speed": 40,
                        "size_min": 0.1,
                        "sync": false
                    }
                },
                "line_linked": {
                    "enable": false,
                    "distance": 150,
                    "color": "#ffffff",
                    "opacity": 0.4,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 6,
                    "direction": "none",
                    "random": false,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false,
                    "attract": {
                        "enable": false,
                        "rotateX": 600,
                        "rotateY": 1200
                    }
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": {
                        "enable": false,
                        "mode": "repulse"
                    },
                    "onclick": {
                        "enable": false,
                        "mode": "push"
                    },
                    "resize": true
                }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
