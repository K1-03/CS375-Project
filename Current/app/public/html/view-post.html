<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current - Video</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/view-post.css">
</head>
<body>
    <header>
        <div class="header-left">
            <a href="/" class="home-button">Current</a>
        </div>
        <div class="header-right">
            <span id="username"></span>
            <a href="/html/account.html"><img id="avatar" src="/images/Placeholder_Profile_Image.jpg" alt="Avatar" class="avatar"></a>
        </div>
    </header>
    <main class="main" id="main">
        <div id="post">
            <p id="subject"></p>
            <img id="optional-image" display="none">
            <p id="textContent"></p>
            <p id="uploadDate"></p>
        </div>
        <div id="comment-section">
            <div class="comment-box">
                <img src="/images/Placeholder_Profile_Image.jpg" alt="User Avatar" class="comment-avatar" id="avatar-preview">
                <input type="text" id="comment-input" placeholder="Add a comment..." maxlength="500">
            </div>
            <div id="comment-buttons">
                <button id="cancel-button">Cancel</button>
                <button id="comment-button" disabled>Comment</button>
            </div>
            <div id="comments"></div>
        </div>
    </main>
    <script src="/javascript/view-post.js"></script>
</body>
</html>
