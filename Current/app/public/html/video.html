<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current - Video</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/video.css">
</head>
<body>
    <header>
        <div class="header-left">
            <a href="/" class="home-button">Current</a>
        </div>
        <div class="header-center">
            <input type="text" placeholder="Search" id="search-bar">
        </div>
        <div class="header-right">
            <a href="/account"><img src="/images/Placeholder_Profile_Image.jpg" alt="Avatar" class="avatar"></a>
        </div>
    </header>
    <main class="main">
        <div class="video-player" id="video-player">
        </div>
        <p id="video-title"></p>
        <!--This is where account info and video insights should go-->
        <div id="insights">
            <button id="like" type="button"> Like </button>
            <button id="dislike" type="button"> Dislike </button>
        </div>
        <div id="description-box"> 
            <p id="upload-date"> </p>
            <p id="description-text"> </p>
        </div>
    </main>
    <script src="/javascript/video.js"></script>
</body>
</html>
