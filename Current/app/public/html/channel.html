<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel Page</title>
    <link rel="stylesheet" href="/css/channel.css">
</head>
<body>
    <div id="particles-js"></div>
    <header>
        <div class="header-left">
            <a href="/" class="home-button">Current</a>
        </div>
        <div class="header-right">
            <span id="username-display"></span>
            <div class="dropdown">
                <img id="avatar" src="/images/Placeholder_Profile_Image.jpg" alt="Avatar" class="avatar dropdown-toggle">
                <div class="dropdown-menu" id="dropdown-menu">
                    <a href="/html/signin.html" id="signin-link">Sign In</a>
                </div>
            </div>
        </div>
    </header>
    <div class="channel-container">
        <div class="channel-content">
            <div class="channel-header">
                <img id="profile-picture" src="" alt="Profile Picture">
                <div class="user-info">
                    <h1 id="user-name"></h1>
                    <p id="user-username"></p>
                </div>
                <div class="button-container">
                    <div class="button-wrapper" id="upload-button-wrapper" style="display: none;">
                        <a class="create-button" id="upload-button" href="/upload">Upload</a>
                    </div>
                    <div class="button-wrapper" id="post-button-wrapper" style="display: none;">
                        <a class="create-button" id="post-button" href="/post">Post</a>
                    </div>
                </div>
                <button id="follow-button" style="display: none;">Follow</button>
            </div>
            <div class="channel-tabs">
                <ul>
                    <li class="active-tab"><a href="javascript:void(0);" onclick="showTab('home-tab', this.parentElement);">Home</a></li>
                    <li><a href="javascript:void(0);" onclick="console.log('Videos tab clicked'); showTab('videos-tab', this.parentElement); loadUserVideos(userId, '/user_videos');">Videos</a></li>
                    <li><a href="javascript:void(0);" onclick="showTab('posts-tab', this.parentElement); loadUserPosts();">Posts</a></li>
                </ul>
            </div>
            <div id="home-tab" class="tab-content">
                <div id="home-videos-container"></div>
            </div>
            <div id="videos-tab" class="tab-content" style="display: none;">
                <div id="videos-videos-container"></div>
            </div>
            <div id="posts-tab" class="tab-content" style="display: none;">
                <div id="posts-container"></div>
            </div>
        </div>
    </div>
    <script src="/javascript/channel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            "particles": {
                "number": {
                    "value": 80,
                    "density": {
                        "enable": true,
                        "value_area": 700
                    }
                },
                "color": {
                    "value": "#ffffff"
                },
                "shape": {
                    "type": "circle",
                    "stroke": {
                        "width": 0,
                        "color": "#000000"
                    }
                },
                "opacity": {
                    "value": 0.5,
                    "random": false,
                    "anim": {
                        "enable": false,
                        "speed": 1,
                        "opacity_min": 0.1,
                        "sync": false
                    }
                },
                "size": {
                    "value": 3,
                    "random": true,
                    "anim": {
                        "enable": false,
                        "speed": 40,
                        "size_min": 0.1,
                        "sync": false
                    }
                },
                "line_linked": {
                    "enable": false,
                    "distance": 150,
                    "color": "#ffffff",
                    "opacity": 0.4,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 6,
                    "direction": "none",
                    "random": false,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false,
                    "attract": {
                        "enable": false,
                        "rotateX": 600,
                        "rotateY": 1200
                    }
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": {
                        "enable": false,
                        "mode": "repulse"
                    },
                    "onclick": {
                        "enable": false,
                        "mode": "push"
                    },
                    "resize": true
                }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
